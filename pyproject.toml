[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqs"
version = "2.0.0"
description = "Adiabatic Quantum Simulation toolkit for topological properties (SSH-Hubbard + arbitrary Hamiltonians, qiskit/CUDA-Q backends)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Michael Yang" }]
keywords = ["quantum-simulation", "topological-insulator", "SSH-Hubbard",
            "berry-phase", "qiskit", "cuda-quantum", "cudaq", "adiabatic"]

# Core dependencies adapt to the Python version automatically (PEP 508 markers):
#   * Python 3.9   -> conservative pins (newer Rust wheels fail to import there)
#   * Python 3.10+ -> current releases (matches the reference GPU venv:
#                     qiskit 2.3, openfermion 1.7.1, numpy 2.x, scipy 1.16)
dependencies = [
    # --- Python 3.9 (conservative pins) ---
    "qiskit==1.0.2;     python_version < '3.10'",
    "rustworkx==0.15.1; python_version < '3.10'",
    "numpy>=1.23,<2;    python_version < '3.10'",
    # --- Python 3.10+ (current releases) ---
    "qiskit>=1.0;       python_version >= '3.10'",
    "numpy>=1.23;       python_version >= '3.10'",
    # --- version-independent ---
    "openfermion>=1.5",
    "scipy>=1.9",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
# GPU backend (NVIDIA CUDA-Q). Linux + NVIDIA GPU only.
#   pip install "aqs[gpu]"      (or:  pip install -r requirements-gpu.txt)
gpu = [
    "cudaq>=0.13",
    "cupy-cuda13x>=13",
]

[project.scripts]
aqs = "aqs.cli:main"

[tool.setuptools]
packages = ["aqs"]
