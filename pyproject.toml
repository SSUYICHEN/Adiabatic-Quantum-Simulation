[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqs"
version = "2.0.0"
description = "Adiabatic Quantum Simulation toolkit for topological properties (SSH-Hubbard + arbitrary Hamiltonians, qiskit/CUDA-Q backends)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ssu Yi Chen" }]

# Core (CPU) dependencies. These carry no CUDA requirement, so a plain
# `uv sync` produces a working CPU-only environment on any platform.
dependencies = [
    "qiskit>=1.0",
    "numpy>=1.23",
    "openfermion>=1.5",
    "scipy>=1.9",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# GPU backends (NVIDIA CUDA-Q). Linux + NVIDIA GPU only.
#
# Pick the extra that matches your *driver's* CUDA major version, which you can
# read off the top-right of `nvidia-smi`:
#
#     CUDA 12.x driver (>= 525)   ->  uv sync --extra cu12
#     CUDA 13.x driver (>= 580)   ->  uv sync --extra cu13
#
# These are mutually exclusive (see [tool.uv] conflicts below): installing the
# cu13 wheels against a CUDA 12 driver fails at import time, which is why there
# is no single "gpu" extra that tries to guess.
#
# cuda-quantum-cu1x pins its own compatible cupy release (e.g. 0.15.1 requires
# cupy-cuda12x>=13.6,<13.7), so the cupy constraints below are deliberately
# loose lower bounds - they declare the direct import in backends.py without
# fighting CUDA-Q's pin.
# ---------------------------------------------------------------------------
cu12 = [
    "cuda-quantum-cu12>=0.12",
    "cupy-cuda12x>=13.4",
]
cu13 = [
    # cuda-quantum-cu13 has no release supporting Python < 3.11.
    "cuda-quantum-cu13>=0.13; python_version >= '3.11'",
    "cupy-cuda13x>=13.6; python_version >= '3.11'",
]

[project.scripts]
aqs = "aqs.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["aqs"]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
[tool.uv]
# cu12 and cu13 ship the same module names against different CUDA runtimes;
# they can never be installed together. Declaring the conflict lets uv keep
# both in a single uv.lock and still resolve each one independently.
conflicts = [
    [{ extra = "cu12" }, { extra = "cu13" }],
]

# ---------------------------------------------------------------------------
# Test dependencies. uv installs the `dev` group by default, so a plain
# `uv sync` gives you a runnable test suite; skip it with `uv sync --no-dev`.
# Declared here rather than only in requirements-dev.txt so that `uv sync` does
# not silently uninstall the test tooling -- uv makes the environment match the
# lockfile exactly, and anything absent from it gets removed.
#
#   uv run pytest tests/ -q
#   uv run coverage run --source=src/aqs -m pytest tests/ && uv run coverage report -m
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=7",
    "coverage>=7",
]
